<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SPOT 팀 페이지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oswald:wght@600&display=swap">
<style>
/* Layout: the team's player card pinned on the left, its club screen (philosophy, traits, facts, home ground map) on the right. Same tokens as the SPOT search screen. */
:root{
  color-scheme:dark;
  --bg:#080c1c; --panel:#0e1430; --line:#1f2850; --fg:#eef1ff; --mute:#7c86b3;
  --accent:#5ef2d6; --card:#111838;
  --t-e:#4fd8ff; --t-m:#5b8cff; --t-h:#a78bfa;
  --t-k5:#f6c453; --t-k6:#cfd6e6; --t-k7:#e0915a; --t-x:#4de3a8;
  --map:#151d47; --map-dong:#2a3570; --map-gu:#5a6ad0;
  --c:var(--accent);
  --display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;
  background-image:radial-gradient(60rem 40rem at 70% -10%,#16205a55,transparent 70%);background-repeat:no-repeat}
*{box-sizing:border-box}
h1,h2,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1280px;margin:0 auto;display:grid;gap:24px;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 20px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.14em;display:flex;align-items:center;gap:10px}
.logo i{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #5ef2d622,0 0 18px var(--accent)}
.btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);font-weight:600;text-decoration:none;transition:background .15s,color .15s,translate .08s}
.btn:hover{background:var(--accent);color:var(--bg)}
.btn:active{translate:0 1px}

.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.cardcol{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));perspective:1200px}

/* the same player card as the search screen */
.card{--shape:polygon(0 7%,16% 7%,50% 0,84% 7%,100% 7%,100% 84%,50% 100%,0 84%);
  aspect-ratio:5/7;width:100%;max-width:300px;margin:0 auto;position:relative;filter:drop-shadow(0 14px 28px color-mix(in srgb,var(--c) 28%,transparent));
  animation:deal .6s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:0;clip-path:var(--shape);
  background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 25%,var(--bg)) 55%,var(--c))}
.in{position:absolute;inset:2px;clip-path:var(--shape);overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% 0,color-mix(in srgb,var(--c) 34%,transparent),transparent 70%),
    repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 9px),
    var(--card);
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:21% 11% 0;text-align:center}
.in::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff40 50%,transparent 60%);
  translate:-120% 0;animation:sheen .9s ease-out .4s both;pointer-events:none}
.top{width:100%;display:flex;justify-content:space-between;align-items:baseline}
.code{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;color:var(--c)}
.where{font-size:13px;color:var(--mute);font-weight:500}
.crest{width:92px;height:92px;display:grid;place-items:center;flex:none;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 45%,var(--bg)));
  color:var(--bg);font-weight:600;font-size:40px}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.has-logo{clip-path:none;background:none;filter:drop-shadow(0 4px 10px #0008)}
.en{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--mute);margin-top:-6px}
.cname{font-weight:600;font-size:20px;line-height:1.25}
.cstats{display:flex;gap:16px;font-family:var(--display);font-size:14px;color:var(--mute);
  border-top:1px solid color-mix(in srgb,var(--c) 30%,transparent);padding-top:10px}
.cstats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-right:3px}
@keyframes deal{from{opacity:0;transform:translateY(28px) rotateY(-65deg) scale(.9)}}
@keyframes sheen{to{translate:120% 0}}

/* club screen */
.screen{display:grid;gap:20px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.panel h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute);margin-bottom:12px}
.hero{border-color:color-mix(in srgb,var(--c) 45%,var(--line));
  background:radial-gradient(120% 140% at 0 0,color-mix(in srgb,var(--c) 22%,transparent),transparent 65%),repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 9px),var(--panel);
  padding:32px 28px}
.hero h1{font-size:clamp(24px,2.800vw,34px);font-weight:600;line-height:1.25}
.hero .meta{color:var(--mute);margin-top:2px}
.motto{font-weight:600;font-size:clamp(34px,5.600vw,68px);line-height:1.15;letter-spacing:-.02em;color:var(--c);margin-top:4px;text-shadow:0 0 34px color-mix(in srgb,var(--c) 40%,transparent)}
.intro{margin-top:14px;font-size:clamp(17px,1.800vw,21px);font-weight:500}
.panel h2.label{margin:30px 0 0}
button.btn{background:none;font:inherit;font-weight:600;cursor:pointer}
.more{gap:8px;margin-top:22px;border-color:var(--c);color:var(--c)}
.more:hover{background:var(--c);color:var(--bg)}
.more svg{transition:translate .15s}.more:hover svg{translate:3px 0}
dialog{border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:20px;padding:32px;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;color:var(--fg);
  background:radial-gradient(120% 90% at 0 0,color-mix(in srgb,var(--c) 20%,transparent),transparent 60%),repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 9px),var(--panel)}
dialog[open]{animation:pop-in .3s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:#04060ecc}
@keyframes pop-in{from{opacity:0;transform:translateY(16px) scale(.97)}}
.d-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
dialog h2{font-size:clamp(22px,3vw,30px);font-weight:600;line-height:1.35;letter-spacing:-.01em;margin-top:6px;color:var(--c);text-wrap:balance}
.d-body{font-size:17px;margin-top:14px}
.d-points{list-style:none;padding:0;margin:24px 0;display:grid;gap:10px}
.d-points li{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#080c1c80}
.d-num{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;color:var(--c);min-width:18px}
.d-points h3{margin:0;font-size:15px;font-weight:600}
.d-points p{font-size:13.500px;color:var(--mute);margin-top:2px}
.tag{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;font-weight:400;white-space:nowrap;color:var(--mute);vertical-align:4px;margin-left:6px}

.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.facts dd.long{font-family:var(--body);font-weight:600;font-size:clamp(16px,1.700vw,21px);line-height:1.45;margin-top:5px}
.facts>div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.facts dt{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.08em}
.facts dd{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.200vw,28px);font-variant-numeric:tabular-nums;margin-top:2px}

.pair{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.traits{display:grid;gap:10px}
.traits li{display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:17px;transition:border-color .15s,translate .15s}
.traits li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.traits li:hover{border-color:var(--c);translate:2px 0}

.place{font-weight:600;font-size:20px;margin-bottom:12px}
.place span{font-weight:400;color:var(--mute);font-size:15px}
.mapbox svg{display:block;width:100%;height:auto;max-height:520px}
.gu{fill:var(--map)}
.gu.here{fill:color-mix(in srgb,var(--c) 26%,var(--map))}
.dong{fill:none;stroke:var(--map-dong);stroke-width:1;vector-effect:non-scaling-stroke}
.gline{fill:none;stroke:var(--map-gu);stroke-width:1.600;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dot{fill:var(--c);stroke:var(--fg);stroke-width:4}
.halo{fill:var(--c);opacity:.4;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.600);opacity:0}}


/* gallery card (same frame as the search screen) */
.g-card{background:#0f1530;border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.g-art{aspect-ratio:4/5;margin:12px 12px 0;background:var(--bg);border-radius:6px;display:grid;place-items:center;overflow:hidden}
.g-art img{width:100%;height:100%;object-fit:contain;display:block}
.g-art .crest{width:46%;height:auto;aspect-ratio:1;font-size:56px}
.g-info{padding:13px 14px 14px}
.g-name{font-weight:600;font-size:16px;line-height:1.3}
.g-sub{font-size:13px;color:var(--mute)}
.visit{width:100%;justify-content:center;gap:8px;margin-top:14px;height:50px;background:var(--accent);color:var(--bg)}
.visit:hover{filter:brightness(1.1)}
.visit svg{transition:translate .15s}.visit:hover svg{translate:3px 0}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* ---------- locker room: the photo is the screen; content sits on see-through plates over it ---------- */
body.in-room{overflow:hidden}
body.in-room .app{max-width:none;padding:0;display:block}
.room{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:var(--bg)}
.room picture,.room picture img{position:absolute;inset:0;width:100%;height:100%}
.room picture img{object-fit:cover;object-position:50% 30%;animation:settle 1.600s cubic-bezier(.2,.6,.2,1) both}
.room::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,#050a1ccc 0,transparent 15%,transparent 46%,#050a1c8c 70%,#050a1cf0 100%)}
@keyframes settle{from{transform:scale(1.060);filter:brightness(.55)}}
.lk-bar{position:absolute;z-index:3;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.lk-id{display:flex;align-items:center;gap:14px;min-width:0}
.lk-id img,.lk-id .mono{width:44px;height:44px;flex:none;border-radius:50%}
.lk-id .mono{display:grid;place-items:center;background:var(--c);color:var(--bg);font-weight:700}
.lk-id div{border-left:1px solid #ffffff40;padding-left:14px;min-width:0}
.lk-id b{display:block;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.06em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-id span{font-family:var(--display);font-size:12px;letter-spacing:.2em;color:#c9d1e6}
.lk-back{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;color:var(--fg);text-decoration:none;font-weight:500;font-size:14px;border-bottom:1px solid transparent;transition:border-color .2s}
.lk-back:hover{border-bottom-color:var(--fg)}
.lk-main{position:absolute;z-index:2;left:0;right:0;top:min(50%,calc(100% - 84px - 370px));bottom:84px;display:flex;flex-direction:column;gap:10px}
.lk-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
.lk-head h1{font-size:clamp(20px,2.200vw,26px);font-weight:600;letter-spacing:.02em;text-shadow:0 2px 14px #000c}
.lk-pager{display:flex;gap:8px}
.lk-pager button{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff4d;background:#070d2499;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:border-color .2s,color .2s,translate .08s}
.lk-pager button:hover{border-color:var(--accent);color:var(--accent)}
.lk-pager button:active{translate:0 1px}
.lk-pager button:disabled{opacity:.3;cursor:default;border-color:#ffffff4d;color:var(--fg)}
.lk-track{flex:1;min-height:0;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;cursor:grab;
  padding:4px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));scroll-padding-left:24px;overscroll-behavior-x:contain;user-select:none;-webkit-user-select:none}
.lk-track::-webkit-scrollbar{display:none}
.lk-track.drag{cursor:grabbing;scroll-snap-type:none}
.plate{flex:none;scroll-snap-align:start;position:relative;color:var(--fg);
  background:linear-gradient(180deg,#0a1230a8,#060b1ec4);-webkit-backdrop-filter:blur(7px) saturate(1.100);backdrop-filter:blur(7px) saturate(1.100);
  border:1px solid #ffffff2b;border-top-color:color-mix(in srgb,var(--c) 70%,#fff 0%);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%);
  animation:plate .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*45ms)}
@keyframes plate{from{opacity:0;transform:translateY(22px)}}
/* 팀 소식 */
.news{width:min(340px,78vw);padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px;align-self:flex-start;min-height:200px}
.news .row{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-size:13px;color:#c9d1e6;padding-right:14px}
.news .kind{font-family:var(--body);font-size:12px;font-weight:600;color:var(--bg);background:var(--c);padding:1px 9px;border-radius:999px}
.news h2{font-size:18px;font-weight:600;line-height:1.4;margin-top:4px}
.news p{font-size:14px;color:#c9d1e6;line-height:1.6}
/* 선수명단 */
.player{font:inherit;cursor:pointer;width:clamp(138px,13vw,176px);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:translate .2s,border-color .2s}
.player:hover{translate:0 -4px;border-color:var(--accent)}
.shirt{display:block;width:100%;height:auto;max-height:100%;min-height:0;filter:drop-shadow(0 10px 14px #0009)}
.player .shirt{flex:0 1 auto;max-height:calc(100% - 26px)}
.shirt text{font-family:var(--body);font-weight:600;text-anchor:middle}
.shirt .num{font-family:var(--display);font-weight:700}
.player .pos{font-family:var(--display);font-size:12.500px;letter-spacing:.16em;color:#c9d1e6}
/* 팀 컬러 */
.mark{width:min(560px,88vw);padding:20px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.mark img{width:clamp(96px,11vw,150px);height:auto}
.mark h2,.kits h2{font-size:13px;font-weight:600;letter-spacing:.12em;color:#c9d1e6;margin-bottom:8px}
.mark dl{display:grid;gap:7px}
.mark dt{font-weight:600;font-size:14.500px}
.mark dd{font-size:13px;color:#c9d1e6;line-height:1.5}
.kits{width:min(470px,88vw);padding:20px 22px;display:flex;flex-direction:column}
.kits .pair{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.kits figure{margin:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.kits .shirt{flex:none;width:clamp(104px,9.500vw,136px);height:auto}
.kits figcaption{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.kits figcaption i{width:14px;height:14px;border-radius:50%;border:1px solid #ffffff80}
.slogan{width:min(520px,88vw);padding:24px 26px;display:flex;flex-direction:column;justify-content:center}
.slogan p{font-size:clamp(34px,4.600vw,60px);font-weight:600;line-height:1.15;letter-spacing:-.02em;color:var(--fg);text-shadow:0 0 30px color-mix(in srgb,var(--c) 70%,transparent)}
.slogan span{font-family:var(--display);font-size:14px;letter-spacing:.24em;color:var(--c);margin-top:12px}
/* tabs on the floor */
.lk-tabs{position:absolute;z-index:3;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;gap:10px;
  padding:0 max(24px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(24px,env(safe-area-inset-left,0px))}
.lk-tabs button{position:relative;height:48px;padding:0 16px 0 0;margin-right:14px;border:0;background:none;cursor:pointer;font:inherit;font-size:16px;font-weight:500;letter-spacing:.1em;color:#ffffffa8;transition:color .2s}
.lk-tabs button::after{content:"";position:absolute;left:0;right:16px;bottom:5px;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.lk-tabs button:hover{color:var(--fg)}
.lk-tabs button[aria-selected="true"]{color:var(--fg);font-weight:600}
.lk-tabs button[aria-selected="true"]::after{transform:scaleX(1)}
@media (orientation:portrait),(max-width:760px){
  .room .fx-sun,.room .fx-shade{width:86%;height:44%;top:8%}
  .room picture img{object-position:50% 0}
  .lk-id b{font-size:15px}.lk-id span{font-size:10.500px}
  .lk-back span{display:none}
  .lk-main{top:min(43%,calc(100% - 76px - 400px));bottom:76px}
  .lk-head{padding:0 16px}
  .lk-track{padding-left:16px;padding-right:16px;scroll-padding-left:16px;gap:12px}
  .player{width:40vw;max-width:176px}
  .mark{grid-template-columns:minmax(0,1fr);gap:10px;align-content:center;justify-items:start}
  .mark img{width:84px}
  .mark dd{font-size:12.500px}
  .lk-tabs{height:76px;gap:0;padding-left:8px;padding-right:8px}
  .lk-tabs button{flex:1;margin:0;padding:0;font-size:15px;letter-spacing:.04em}
  .lk-tabs button::after{left:22%;right:22%}
}

/* ---------- player locker: one player's own locker. The photo carries the shirt; name and number are set on it live. ---------- */
.plk{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:var(--bg);touch-action:pan-y}
.plk__blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(26px) brightness(.45)}
.pstage{position:absolute;top:0;left:50%;translate:-50% 0;height:100%;aspect-ratio:941/1340;container-type:size;animation:settle 1.200s cubic-bezier(.2,.6,.2,1) both}
.pstage>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pstage span{position:absolute;left:50%;translate:-50% -50%;white-space:nowrap;line-height:1;color:#efece4;pointer-events:none}
.gk .pstage .j-name,.gk .pstage .j-num,.gk .pstage .j-short{color:#0b1430;text-shadow:none}
.j-plate{top:16.100%;font-family:var(--body);font-weight:600;font-size:1.900cqh;letter-spacing:.14em;color:#e4e9f6}
.j-name{top:35.700%;font-family:var(--body);font-weight:700;font-size:3.500cqh;letter-spacing:.14em;text-shadow:0 1px 2px #0006;opacity:.95}
.j-num{top:44.800%;font-family:"Oswald",var(--display);font-weight:600;font-size:15cqh;letter-spacing:-.01em;text-shadow:0 2px 3px #0005;opacity:.95}
.j-short{left:45.900%!important;top:73.900%;font-family:"Oswald",var(--display);font-weight:600;font-style:italic;font-size:2.100cqh;rotate:-3deg;opacity:.9}

<script src="teams.js"></script>
<script>
document.documentElement.lang='ko';
function draw(){
let id=location.hash.slice(1);
const pm=id.match(/^(.*)-p(\d+)$/);
if(pm)id=pm[1];
const inRoom=id.endsWith('-locker');
if(inRoom)id=id.slice(0,-7);
const t=TEAMS.find(x=>x.id===id)||TEAMS[0];
const slot=pm&&t.squad&&t.squad[+pm[2]]?+pm[2]:-1;
document.body.classList.toggle('in-room',(inRoom&&!!t.room)||slot>=0);
document.documentElement.style.setProperty('--c',`var(--t-${t.t})`);
VIEW={t,slot,room:inRoom};
Store.open(t);
if(slot>=0){drawPlayer(t,slot);return}
if(inRoom&&t.room){drawLocker(t);return}
scrollTo(0,0);
document.documentElement.style.setProperty('--c',`var(--t-${t.t})`);
const crest=`<span class="crest${t.logo?' has-logo':''}" aria-hidden="true">${t.logo?`<img src="${t.logo}" alt="">`:t.name[0]}</span>`;
const tag=t.demo?'<span class="tag">예시 팀</span>':'';
document.getElementById('page').innerHTML=`
<header class="topbar"><span class="logo"><i></i>SPOT</span><a class="btn" href="index.html">팀 찾기로 돌아가기</a></header>
<main class="cols">
  <div class="cardcol"><div class="g-card">
    <div class="g-art">${t.poster?`<img src="${t.poster}" alt="${t.name} 포스터">`:crest}</div>
    <div class="g-info"><div class="g-name">${t.name}${tag}</div><div class="g-sub">${t.area} · ${T[t.t].a}</div></div>
  </div>
  ${t.room?`<a class="btn visit" href="#${t.id}-locker">팀 라커룸 방문<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>`:''}</div>
  <div class="screen">
    <section class="panel hero">
      <h1>${t.name}${tag}</h1>
      <p class="meta">${t.en?`<span class="meta-en">${t.en}</span>`:''}<span>${T[t.t].a} · ${t.area}</span></p>
      ${t.intro?`<p class="intro">${t.intro}</p>`:''}
      <h2 class="label">팀 철학</h2>
      <p class="motto">${t.motto}</p>
      ${t.detail?`<button type="button" class="btn more" id="openDetail">팀 철학 상세 보기<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`:''}
    </section>
    <dl class="facts">
      <div><dt>연령대</dt><dd>${T[t.t].a}</dd></div>${t.kind?`<div class="wide"><dt>유형</dt><dd class="long">${t.kind}</dd></div>`:''}<div><dt>창단</dt><dd>${t.y}년</dd></div><div><dt>인원</dt><dd>${t.n}명</dd></div>
    </dl>
    <div class="pair">
      <section class="panel"><h2>핵심 가치</h2><ul class="traits">${t.v.map(v=>`<li>${v}</li>`).join('')}</ul></section>
      <section class="panel mapbox"><h2>활동 지역</h2><p class="place">${t.sido} ${t.sgg}${t.dong?`<span> ${t.dong}</span>`:''}</p>
        <svg viewBox="0 0 ${KR.vb[0]} ${KR.vb[1]}" role="img" aria-label="전국 지도에서 ${t.sido} ${t.sgg} 위치">
          ${Object.entries(KR.sido).map(([g,d])=>`<path class="gu${g===t.sido?' here':''}" d="${d.d}"/>`).join('')}
          <path class="dong" d="${Object.values(KR.sgg).map(o=>Object.values(o).map(x=>x.d).join('')).join('')}"/>
          ${Object.values(KR.sido).map(d=>`<path class="gline" d="${d.d}"/>`).join('')}
          <circle class="halo" cx="${t.px}" cy="${t.py}" r="16"/><circle class="dot" cx="${t.px}" cy="${t.py}" r="13"/>
        </svg>
      </section>
    </div>
  </div>
</main>
${t.detail?`<dialog id="detail" aria-labelledby="detailTitle">
  <p class="d-kicker">팀 철학</p>
  <h2 id="detailTitle">${t.detail.title}</h2>
  <p class="d-body">${t.detail.body}</p>
  <ol class="d-points">${t.detail.points.map(([h,p],i)=>`<li><span class="d-num">${i+1}</span><div><h3>${h}</h3><p>${p}</p></div></li>`).join('')}</ol>
  <button type="button" class="btn" id="closeDetail">상세 창 닫기</button>
</dialog>`:''}`;
const dlg=document.getElementById('detail');
if(dlg){
  document.getElementById('openDetail').onclick=()=>dlg.showModal();
  document.getElementById('closeDetail').onclick=()=>dlg.close();
  dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
}
}


/* ---------- what players type in: shared store when the page has one, this device otherwise ---------- */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let VIEW={},lastCat=0,openCat=0,curCat=null;
const Store={
  team:null,P:{},J:{},db:null,uid:null,mode:'local',unsub:null,
  key(){return 'spot:'+this.team.id},
  readLocal(){try{return JSON.parse(localStorage.getItem(this.key()))||{}}catch(e){return {}}},
  writeLocal(){try{localStorage.setItem(this.key(),JSON.stringify({P:this.P,J:this.J}))}catch(e){}},
  open(t){
    if(this.team===t)return;
    this.team=t;const l=this.readLocal();this.P=l.P||{};this.J=l.J||{};
    if(this.unsub){this.unsub();this.unsub=null}
    (async()=>{
      const cl=window.claude;if(!cl||!cl.use)return;
      const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
      if(!db||this.team!==t)return;
      this.db=db;this.mode='shared';
      try{this.uid=user?await user.id():null}catch(e){this.uid=null}
      this.unsub=db.collection(`teams/${t.id}/players`).onSnapshot(snap=>{
        snap.docs.forEach(d=>{const m=d.id.match(/^p(\d+)$/);if(m&&d.exists)this.P[m[1]]=d.data()});
        this.writeLocal();refresh();
      },()=>{this.mode='local'});
    })();
  },
  async save(slot,patch){
    this.P[slot]={...(this.P[slot]||{}),...patch};this.writeLocal();
    if(this.db&&this.mode==='shared'){

  jref(slot){return this.db&&this.uid?this.db.collection('data/users/'+this.uid).doc(`journal-${this.team.id}-p${slot}`):null},
  async loadJournal(slot){

  },

};

  track.addEventListener('pointerup',drop);track.addEventListener('pointerleave',drop);track.addEventListener('pointercancel',drop);
  track.addEventListener('click',e=>{const b=e.target.closest('.player');if(!b)return;if(moved){moved=false;return}lastCat=1;location.hash=`${t.id}-p${b.dataset.slot}`});
  addEventListener('resize',ends);
  curCat=open;
  open(lastCat);lastCat=0;
}
draw();addEventListener('hashchange',draw);
</script>
