<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SPOT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="전국 유·청소년 축구팀을 연령대와 지역으로 찾고 팀 철학을 확인하는 사이트">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: scouting console on the left, one large stage (card deck or district map) on the right. Single dark look. */
:root{
  color-scheme:dark;
  --bg:#080c1c; --panel:#0e1430; --line:#1f2850; --fg:#eef1ff; --mute:#7c86b3;
  --accent:#5ef2d6; --card:#111838; --frame:#0f1530; --mat:#080c1c; --veil:#04060ecc;
  --t-e:#4fd8ff; --t-m:#5b8cff; --t-h:#a78bfa;
  --t-k5:#f6c453; --t-k6:#cfd6e6; --t-k7:#e0915a; --t-x:#4de3a8;
  --map:#151d47; --map-on:#22307a; --map-dong:#2a3570; --map-gu:#5a6ad0;
  --display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;word-break:keep-all;
  background-image:radial-gradient(60rem 40rem at 70% -10%,#16205a55,transparent 70%);background-repeat:no-repeat}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px}
.skip:focus{left:16px;top:16px;z-index:5;background:var(--accent);color:var(--bg);padding:10px 14px;border-radius:10px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:28px;max-width:1500px;margin:0 auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- console ---------- */
.side{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:22px;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.logo{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.14em;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #5ef2d622,0 0 18px var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;stroke:var(--mute)}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px 0 40px}
.search input::placeholder{color:var(--mute)}
.search input:focus{outline:none;border-color:var(--accent)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--accent);height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;
  cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s,color .15s,translate .08s}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip:hover{border-color:var(--c)}
.chip:active{translate:0 1px}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--bg);font-weight:600}
.chip[aria-pressed="true"]::before{background:var(--bg)}
.chip.gu::before{display:none}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:none;color:var(--accent);font-weight:600;cursor:pointer;transition:background .15s,color .15s,translate .08s}
.btn:hover{background:var(--accent);color:var(--bg)}
.btn:active{translate:0 1px}

/* ---------- stage ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(24px,2.800vw,34px);line-height:1.25;font-weight:600;letter-spacing:-.01em}
.intro p{margin-top:8px;color:var(--mute);max-width:40em;font-size:15px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-family:var(--display);font-size:15px;color:var(--mute)}
.count b{font-size:34px;color:var(--fg);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{height:38px;padding:0 16px;border:0;border-radius:9px;background:none;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500;transition:translate .08s}
.seg button:active{translate:0 1px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.seg svg{stroke:currentColor}

/* ---------- gallery cards: one frame for every poster, neon only on hover / focus / open ---------- */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:28px 24px}
.card{--c:var(--accent);position:relative;max-width:300px;width:100%;cursor:pointer;perspective:1200px;-webkit-tap-highlight-color:transparent;
  animation:deal .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms);transition:translate .2s}
.card:hover{translate:0 -3px}
.flip{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card.on .flip{transform:rotateY(180deg)}
.face{background:var(--frame);border:1px solid var(--line);border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:border-color .2s,box-shadow .2s}
.card:hover .face,.card:focus-visible .face,.card.on .face{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 26px -6px color-mix(in srgb,var(--accent) 55%,transparent)}
.card:focus-visible{outline:none}
.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex}
/* poster: always whole, never cropped or stretched; the mat takes up the difference */
.art{aspect-ratio:4/5;margin:12px 12px 0;background:var(--mat);border-radius:6px;display:grid;place-items:center;overflow:hidden}
.art img.poster{width:100%;height:100%;object-fit:contain;display:block}
.art .crest{width:46%;height:auto;aspect-ratio:1;font-size:56px}
.info{display:flex;align-items:center;gap:10px;padding:13px 14px 14px}
.info>div{min-width:0;flex:1}
.name{font-weight:600;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);transition:color .2s,border-color .2s,rotate .3s}
.arrow svg{stroke:currentColor}
.card:hover .arrow,.card:focus-visible .arrow{color:var(--accent);border-color:var(--accent)}
/* back: the same frame, details and the way in */
.in{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 18px 16px;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:baseline}
.code{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--fg)}
.where{font-size:12.500px;color:var(--mute);font-weight:500}
.crest{width:64px;height:64px;display:grid;place-items:center;flex:none;margin-top:6px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:var(--mat);color:var(--fg);font-weight:600;font-size:26px}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.has-logo{clip-path:none;background:none}
.in .name{white-space:normal;font-size:17px}
.en{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--mute);margin-top:-6px}
.motto{font-size:14px;line-height:1.45;margin-top:4px}
.stats{display:flex;gap:14px;font-family:var(--display);font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:9px;margin-top:auto}
.stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-right:3px}
.tag{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;font-weight:400;white-space:nowrap;color:var(--mute)}
.go{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin-top:6px;border-radius:10px;flex:none;
  background:var(--accent);color:var(--bg);font-weight:600;font-size:14px;text-decoration:none;
  opacity:0;translate:0 8px;transition:opacity .25s .35s,translate .25s .35s,filter .15s}
.card.on .go{opacity:1;translate:0 0}
.go:hover{filter:brightness(1.1)}
.go:active{translate:0 1px}
.go svg{stroke:currentColor}
@keyframes deal{from{opacity:0;transform:translateY(18px)}}

.none{border:1px dashed var(--line);border-radius:20px;padding:56px 20px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:14px;align-items:center}

/* ---------- map ---------- */
.mapwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px}
.mapwrap>svg{flex:1 1 420px;min-width:0;max-height:calc(100vh - 150px);min-height:420px}
.dist{fill:var(--map);cursor:pointer;transition:fill .2s}
.dist:hover{fill:#1b2660}
.dist.on{fill:var(--map-on)}
.dong{fill:none;stroke:var(--map-dong);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.gline{fill:none;stroke:var(--map-gu);stroke-width:1.800;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.gline.on{stroke:var(--accent)}
.dlabel{fill:var(--mute);font-family:var(--body);font-size:26px;font-weight:600;letter-spacing:.1em;text-anchor:middle;pointer-events:none;opacity:.75;paint-order:stroke;stroke:var(--map);stroke-width:6px}
.pin{cursor:pointer;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*25ms);transform-box:fill-box;transform-origin:center}
.pin .halo{fill:var(--c);opacity:.18}
.pin .dot{fill:var(--c);stroke:var(--bg);stroke-width:3}
.pin:hover .halo,.pin.sel .halo{opacity:.4}
.pin.sel .dot{stroke:var(--fg)}
.pin.sel .halo{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.pin text{fill:var(--fg);font-family:var(--body);font-size:21px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:7px;pointer-events:none}
.pin:focus-visible{outline:none}.pin:focus-visible .dot{stroke:var(--accent)}
@keyframes pop{from{opacity:0;transform:scale(0)}}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.400);opacity:0}}
.detail{flex:0 0 260px;margin:0 auto}

/* ---------- team sheet ---------- */
dialog{--c:var(--accent);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));padding:0;background:var(--panel);color:var(--fg);width:min(700px,calc(100vw - 32px));max-height:calc(100vh - 40px);border-radius:20px;overflow:auto}
dialog::backdrop{background:var(--veil)}
.sheet__band{padding:26px 28px;display:flex;align-items:center;gap:18px;
  background:radial-gradient(120% 140% at 0 0,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 9px)}
.sheet__band .crest{width:72px;height:72px;font-size:30px}
.sheet__band .code{font-size:20px}
.sheet__band h2{font-size:24px;line-height:1.3;font-weight:600}
.sheet__band p{color:var(--mute)}
.sheet__body{padding:8px 28px 28px;display:grid;gap:22px}
.sheet__body h3{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
.sheet__motto{font-size:22px;font-weight:600;line-height:1.4;color:var(--c)}
.sheet__creed{margin-top:8px;max-width:34em;font-size:15px}
.values{display:flex;flex-wrap:wrap;gap:8px}
.values li{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:18px}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.sheet__close{justify-self:start}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px}
  .side{position:static;gap:16px}
  .chip{height:44px}
  .deck{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));justify-items:center;gap:24px 16px}
  .mapwrap>svg{max-height:none}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg{width:100%}.seg button{flex:1;justify-content:center;height:44px}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){.flip,.go,.card,.face,.arrow{transition:none}.card,.pin,.pin.sel .halo{animation:none}.btn,.chip{transition:none}}

/* ---------- phone pass ---------- */
.in{justify-content:center}
.stats{margin-top:10px}
.go{margin-top:auto}
.back .crest{width:76px;height:76px}
.dlabel{opacity:.5}
@media (max-width:820px){
  /* the page title comes first, then the filters, then results */
  .app{display:flex;flex-direction:column}
  .main{display:contents}
  .intro{order:1}.side{order:2}.bar{order:3}#stage{order:4}
  .side .logo{display:none}
  .intro h1{display:flex;align-items:center;gap:10px}
  .intro h1::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #5ef2d622,0 0 18px var(--accent);flex:none}
  .dlabel{font-size:40px}
  .nation .pin text{font-size:44px!important;stroke-width:12px}
  .nation .pin .dot{r:18}.nation .pin .halo{r:34}
  .mapwrap{padding:12px;gap:14px}
  .mapstage{flex-basis:100%;max-height:none;min-height:0}
  .detail{flex-basis:100%;display:grid;justify-items:center}
}

/* ---------- map: nation, then a province lifted out of it ---------- */
.mapstage{position:relative;flex:1 1 380px;min-width:0;aspect-ratio:1000/1860;max-height:calc(100vh - 200px);min-height:460px;overflow:hidden}
.nation{position:absolute;inset:0;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .6s,filter .6s;transform-origin:50% 45%}
.nation.behind{transform:scale(.88);opacity:.2;filter:blur(2px);pointer-events:none}
.nation.still{transition:none}
.nation .dlabel{font-size:36px}
.nation .pin text{stroke-width:9px}
.nation .pin .dot{stroke-width:4}
.region{position:absolute;inset:60px 0 0;filter:drop-shadow(0 30px 26px #000c) drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 30%,transparent))}
.region svg{display:block;width:100%;height:100%}
.region.rise{animation:lift-map .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift-map{from{opacity:0;transform:translateY(90px) scale(.9)}60%{opacity:1}}
.sgg{fill:#18225a;stroke:var(--map-gu);stroke-width:1.200px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .2s}
.sgg:hover{fill:var(--map-on)}
.slabel{fill:#aab3d6;font-family:var(--body);font-weight:500;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#18225a;stroke-width:3px;vector-effect:non-scaling-stroke}
.region .pin .dot{stroke-width:2.500px;vector-effect:non-scaling-stroke}
.region .pin text{stroke-width:5px;vector-effect:non-scaling-stroke}
.maphead{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;animation:deal .4s both}
.maphead h2{font-size:20px;font-weight:600;margin:0}
.mapback{height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;width:auto!important;flex:none}
.nomap{color:var(--mute);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion:reduce){.nation{transition:none}.region.rise,.maphead{animation:none}}

/* ---------- province view, decluttered: quiet land, few names, the rest on demand ---------- */
.sgg{stroke:#3d4a9c;stroke-width:.900px}
.sgg.tone0{fill:#161f55}.sgg.tone1{fill:#1a2460}.sgg.tone2{fill:#131b4c}
.sgg.has{fill:color-mix(in srgb,var(--accent) 22%,#161f55);stroke:color-mix(in srgb,var(--accent) 60%,#3d4a9c)}
.sgg:hover,.sgg.hot{fill:#2a3a8c}
.sgg.has:hover,.sgg.has.hot{fill:color-mix(in srgb,var(--accent) 34%,#161f55)}
.slabel{fill:#c3cbea;opacity:.82;stroke:none;font-weight:500;letter-spacing:.02em;dominant-baseline:middle}
.slabel.hid{display:none}
.region .pin:not(.sel):not(:hover):not(:focus-visible) text{opacity:0}
.region .pin text{fill:#fff;font-weight:700}
.maphead h2{white-space:nowrap}
.maphud{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#080c1ccc;color:var(--mute);font-size:13px;white-space:nowrap;transition:color .15s,border-color .15s}
.maphud::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute);transition:background .15s}
.maphud.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.maphud.on::before{background:var(--accent);box-shadow:0 0 10px var(--accent)}
@media (max-width:820px){
  .maphead{flex-wrap:wrap;gap:8px 10px}
  .maphud{margin-left:0;order:3;font-size:12.500px}
  .region{inset:104px 0 0}
}

/* ---------- map marks, kept few: tinted provinces, one dot, city call-outs ---------- */
.mapstage{aspect-ratio:1420/1860}
.dist.res{fill:color-mix(in srgb,var(--accent) 15%,var(--map))}
.dist.res.on{fill:color-mix(in srgb,var(--accent) 26%,var(--map))}
.call{cursor:pointer}
.call line{stroke:#5a6ad0;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:3 4;opacity:.7}
.call .hit{fill:transparent}
.call .cdot{fill:var(--bg);stroke:#8e9af0;stroke-width:1.500px;vector-effect:non-scaling-stroke}
.call rect:not(.hit){fill:#0e1430;stroke:#3a4796;stroke-width:1px;vector-effect:non-scaling-stroke;transition:stroke .15s,fill .15s}
.call text{fill:var(--fg);font-family:var(--body);font-weight:600;font-size:40px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.call.res rect:not(.hit){fill:color-mix(in srgb,var(--accent) 18%,#0e1430)}
.call:hover rect:not(.hit),.call:focus-visible rect:not(.hit),.call.on rect:not(.hit){stroke:var(--accent);stroke-width:2px}
.call:hover .cdot,.call:focus-visible .cdot,.call.on .cdot{fill:var(--accent);stroke:var(--accent)}
.call:hover line,.call:focus-visible line{stroke:var(--accent);opacity:1}
.call:focus-visible{outline:none}
.spot{cursor:pointer}
.spot .dot{fill:color-mix(in srgb,var(--accent) 62%,#18225a);stroke:#080c1c;stroke-width:2px;vector-effect:non-scaling-stroke;transition:fill .15s}
.spot .halo{fill:var(--accent);opacity:0}
.spot.sel .dot{fill:var(--accent)}
.spot.sel .halo{opacity:.3;transform-box:fill-box;transform-origin:center;animation:pulse 1.800s ease-out infinite}
.spot:hover .dot,.spot:focus-visible .dot{fill:var(--accent)}
.spot:focus-visible{outline:none}
.spot .cnt{fill:#080c1c;font-family:var(--display);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.spot .nm{fill:#fff;font-family:var(--body);font-weight:700;paint-order:stroke;stroke:#0a0f24;stroke-width:4px;vector-effect:non-scaling-stroke;pointer-events:none}
.nation .spot{pointer-events:none}
.tpager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-family:var(--display);color:var(--mute);font-variant-numeric:tabular-nums}
.tpager b{color:var(--fg);font-size:18px}
.tpager button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:border-color .15s,color .15s,translate .08s}
.tpager button:hover{border-color:var(--accent);color:var(--accent)}
.tpager button:active{translate:0 1px}
.detail{flex:0 0 260px}
.detail .card{margin:0 auto}
@media (max-width:820px){
  .call text{font-size:46px}
  .detail{flex-basis:100%;display:block}
}
@media (prefers-reduced-motion:reduce){.spot.sel .halo{animation:none}}
</style>

<a class="skip" href="#results">본문으로 건너뛰기</a>
<div class="app">
  <form class="side" id="filters" aria-label="팀 검색 조건">
    <span class="logo"><i></i>SPOT</span>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
      <input id="q" type="search" placeholder="팀 이름 또는 지역" autocomplete="off" aria-label="팀 이름 또는 지역">
    </div>
    <div class="grp"><h2>연령대</h2><div class="chips" id="youth"></div></div>
    <div class="grp"><h2>지역</h2><div class="chips" id="gus"></div></div>
    <button class="btn" id="reset" type="button">조건 지우기</button>
  </form>

  <main class="main" id="results">
    <div class="intro">
      <h1>전국 유·청소년 축구팀 찾기</h1>
      <p>초등부부터 고등부까지. 전국 17개 시·도에서 우리 지역 팀과 그 팀이 지키는 철학을 확인하세요.</p>
    </div>
    <div class="bar">
      <p class="count" aria-live="polite"><b id="n">0</b>개 팀</p>
      <div class="seg" role="group" aria-label="보기 방식">
        <button id="vCards" type="button" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="9" rx="1.500"/><rect x="3" y="15" width="7" height="6" rx="1.500"/><rect x="14" y="15" width="7" height="6" rx="1.500"/></svg>카드로 보기</button>
        <button id="vMap" type="button" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.200 7-11a7 7 0 1 0-14 0c0 4.800 7 11 7 11Z"/><circle cx="12" cy="10" r="2.500"/></svg>지도로 보기</button>
      </div>
    </div>
    <div id="stage"></div>
  </main>
</div>

<script src="geo-kr.js"></script>
<script src="teams.js"></script>
<script>
document.documentElement.lang='ko';
const S={zoom:null,q:'',t:new Set(),g:new Set(),view:location.hash==='#map'?'map':'cards',sel:null};
const $=id=>document.getElementById(id);

function chip(host,key,label,set,color){
  const b=document.createElement('button');
  b.type='button';b.className='chip'+(color?'':' gu');b.textContent=label;b.id='chip-'+key;
  if(color)b.style.setProperty('--c',`var(--t-${key})`);
  b.setAttribute('aria-pressed','false');
  b.onclick=()=>{set.has(key)?set.delete(key):set.add(key);if(set===S.g&&S.view==='map')S.zoom=S.g.size===1?[...S.g][0]:null;render()};
  host.append(b);
}
['e','m','h'].forEach(k=>chip($('youth'),k,T[k].l,S.t,1));
Object.entries(KR.sido).forEach(([g,d])=>chip($('gus'),g,d.s,S.g,0));

const crest=t=>`<span class="crest${t.logo?' has-logo':''}" aria-hidden="true">${t.logo?`<img src="${t.logo}" alt="">`:t.name[0]}</span>`;
const tag=t=>t.demo?' <span class="tag">예시 팀</span>':'';

function cardHTML(t,i){
  return `<div class="card" role="button" tabindex="0" aria-expanded="false" aria-label="${t.name} 카드 뒤집기" style="--i:${i}"><div class="flip">
    <div class="face front">
      <div class="art">${t.poster?`<img class="poster" src="${t.poster}" alt="${t.name} 포스터">`:crest(t)}</div>
      <div class="info"><div><div class="name">${t.name}${tag(t)}</div><div class="sub">${t.area} · ${T[t.t].a}</div></div>
        <span class="arrow" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    </div>
    <div class="face back"><div class="in">
      <span class="top"><span class="code">${T[t.t].c}</span><span class="where">${t.area}</span></span>
      ${crest(t)}
      <span class="name">${t.name}${tag(t)}</span>
      ${t.en?`<span class="en">${t.en}</span>`:''}
      <span class="motto">${t.motto}</span>
      <span class="stats"><span><b>${t.y}</b>창단</span><span><b>${t.n}</b>명</span></span>
      <a class="go" tabindex="-1" href="team.html#${t.id}" target="_blank" rel="noopener">팀 페이지 보기<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
    </div></div>
  </div></div>`;
}
/* 첫 클릭: 카드 뒤집기. 뒷면의 '팀 페이지 보기'만 새 창을 연다. */
function flip(card){
  const on=!card.classList.contains('on');
  document.querySelectorAll('.card.on').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-expanded','false');c.querySelector('.go').tabIndex=-1});
  if(on){card.classList.add('on');card.setAttribute('aria-expanded','true');card.querySelector('.go').tabIndex=0}
}
$('stage').addEventListener('click',e=>{if(e.target.closest('.go'))return;const c=e.target.closest('.card');if(c)flip(c)});
$('stage').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();flip(e.target)}});
const SGG_LINES=Object.values(KR.sgg).map(o=>Object.values(o).map(x=>x.d).join('')).join('');
function render(){
  const q=S.q.trim().toLowerCase();
  const list=TEAMS.filter(t=>(!S.t.size||S.t.has(t.t))&&(!S.g.size||S.g.has(t.sido))&&(!q||(t.name+(t.en||'')+t.sido+t.area+(t.dong||'')+T[t.t].l+T[t.t].c+(t.kind||'')).toLowerCase().includes(q)));
  $('n').textContent=list.length;
  document.querySelectorAll('.chip').forEach(b=>{const k=b.id.slice(5);b.setAttribute('aria-pressed',S.t.has(k)||S.g.has(k))});
  $('vCards').setAttribute('aria-pressed',S.view==='cards');$('vMap').setAttribute('aria-pressed',S.view==='map');
  const st=$('stage');
  if(!list.length&&S.view==='cards'){st.innerHTML=`<div class="none"><p>조건에 맞는 팀이 없습니다.</p><button type="button" class="btn" onclick="resetAll()">조건 지우기</button></div>`;return}
  if(S.view==='cards'){st.innerHTML=`<div class="deck">${list.map(cardHTML).join('')}</div>`;return}
  /* 지도. 처음에는 땅만 보인다. 조건(검색·연령대·지역)을 주면 해당 시·도가 물들고, 지금 카드에 뜬 팀 하나만 점으로 찍힌다. */
  if(S.zoom&&!S.g.has(S.zoom))S.zoom=null;
  const z=S.zoom&&KR.sido[S.zoom]?S.zoom:null,changed=z!==lastZoom,was=lastZoom;lastZoom=z;
  const active=!!(q||S.t.size||S.g.size),shown=active?list:[];
  if(!shown.includes(S.sel))S.sel=shown[0]||null;
  const res=new Set(shown.map(t=>t.sido)),W0=KR.vb[0],H0=KR.vb[1];
  const nation=`<svg class="nation" viewBox="${-SEA} 0 ${W0+2*SEA} ${H0}" role="group" aria-label="전국 시·도 지도">
    ${Object.entries(KR.sido).map(([g,d])=>`<path class="dist${S.g.has(g)?' on':''}${res.has(g)?' res':''}" data-g="${g}" d="${d.d}"><title>${g}</title></path>`).join('')}
    <path class="dong" d="${SGG_LINES}"/>
    ${Object.entries(KR.sido).map(([g,d])=>`<path class="gline${S.g.has(g)?' on':''}" d="${d.d}"/>`).join('')}
    ${Object.entries(KR.sido).filter(([g])=>!METRO.test(g)).map(([g,d])=>`<text class="dlabel" x="${d.x}" y="${d.y+10}">${d.s}</text>`).join('')}
    ${CALL.map(o=>`<g class="call${S.g.has(o.g)?' on':''}${res.has(o.g)?' res':''}" data-g="${o.g}" tabindex="0" role="button" aria-label="${o.g} 지도 보기">
      <line x1="${o.cx+(o.cx<0?CW/2:-CW/2)}" y1="${o.cy}" x2="${o.d.x}" y2="${o.d.y}"/><circle class="hit" cx="${o.d.x}" cy="${o.d.y}" r="46"/><circle class="cdot" cx="${o.d.x}" cy="${o.d.y}" r="8"/>
      <rect class="hit" x="${o.cx-CW/2-14}" y="${o.cy-CH/2-27}" width="${CW+28}" height="${CH+54}"/><rect x="${o.cx-CW/2}" y="${o.cy-CH/2}" width="${CW}" height="${CH}" rx="${CH/2}"/><text x="${o.cx}" y="${o.cy}">${o.d.s}</text></g>`).join('')}
    ${!z&&S.sel?`<g class="spot sel"><circle class="halo" cx="${S.sel.px}" cy="${S.sel.py}" r="30"/><circle class="dot" cx="${S.sel.px}" cy="${S.sel.py}" r="15"/></g>`:''}
  </svg>`;
  let region='';
  if(z){const b=KR.sido[z].b,u=Math.max(b[2],b[3])/100,ent=Object.entries(KR.sgg[z]),groups={};
    ent.forEach(([k,d])=>(groups[cityOf(k)]=groups[cityOf(k)]||[]).push(d));
    const has=g=>shown.some(t=>t.sido===z&&cityOf(t.sgg)===g);
    /* 같은 시·군·구의 팀은 점 하나로 모으고 수를 적는다. 이름은 지금 카드에 뜬 팀 하나만. */
    const cl={};shown.forEach(t=>{const k=t.px+','+t.py;(cl[k]=cl[k]||[]).push(t)});
    const spots=Object.values(cl).map(ts=>{const t=ts[0],sel=ts.includes(S.sel),r=u*(sel?1.9:1.5),ax=t.px<b[0]+b[2]*.22?'start':t.px>b[0]+b[2]*.78?'end':'middle';
      return `<g class="spot${sel?' sel':''}" data-i="${ts.map(x=>TEAMS.indexOf(x)).join(',')}" tabindex="0" role="button" aria-label="${ts.length>1?t.sgg+' 팀 '+ts.length+'개':t.name}">
        <circle class="halo" cx="${t.px}" cy="${t.py}" r="${r*2.1}"/><circle class="dot" cx="${t.px}" cy="${t.py}" r="${r}"/>
        ${ts.length>1?`<text class="cnt" x="${t.px}" y="${t.py}" style="font-size:${r*1.25}px">${ts.length}</text>`:''}
        ${sel?`<text class="nm" x="${t.px}" y="${t.py-r*2.9}" text-anchor="${ax}" style="font-size:${u*2.9}px">${S.sel.name}</text>`:''}</g>`}).join('');
    region=`<div class="region${changed?' rise':''}"><svg viewBox="${b.join(' ')}" role="group" aria-label="${z} 시·군·구 지도">
      ${ent.map(([k,d],i)=>`<path class="sgg tone${i%3}${has(cityOf(k))?' has':''}" data-n="${k}" data-g="${cityOf(k)}" d="${d.d}"/>`).join('')}
      ${Object.entries(groups).filter(([g])=>!has(g)).map(([g,ds])=>`<text class="slabel" data-g="${g}" x="${(ds.reduce((a,d)=>a+d.x,0)/ds.length).toFixed(1)}" y="${(ds.reduce((a,d)=>a+d.y,0)/ds.length).toFixed(1)}">${shortName(g)}</text>`).join('')}
      ${spots}
    </svg></div>`}
  const at=shown.indexOf(S.sel);
  const side=shown.length?`${cardHTML(S.sel,0)}${shown.length>1?`<div class="tpager"><button type="button" id="tPrev" aria-label="이전 팀 카드"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><span><b>${at+1}</b> / ${shown.length}</span><button type="button" id="tNext" aria-label="다음 팀 카드"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>`:''}`
    :active?`<p class="nomap">${z?z+'에':'이 조건에'} 등록된 팀이 아직 없습니다.</p>`
    :`<p class="nomap">지역을 누르거나 조건을 고르면<br>팀 카드가 여기에 나타납니다.</p>`;
  st.innerHTML=`<div class="mapwrap"><div class="mapstage${z?' zoomed':''}">
      ${z?`<div class="maphead"><button type="button" class="btn mapback" id="mapBack"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>전체 지도 보기</button><h2>${z}</h2><span class="maphud" id="mapHud" aria-live="polite">지역을 가리키면 이름이 나옵니다</span></div>`:''}
      ${nation}${region}</div>
    <div class="detail" id="detail">${side}</div></div>`;
  if(z)declutter(st,KR.sido[z].b);
  const nat=st.querySelector('.nation');
  if(z&&changed){requestAnimationFrame(()=>requestAnimationFrame(()=>nat.classList.add('behind')))}
  else if(z)nat.classList.add('behind','still');
  else if(was&&changed){nat.classList.add('behind','still');requestAnimationFrame(()=>requestAnimationFrame(()=>nat.classList.remove('behind','still')))}
  const zoomTo=g=>{S.g.clear();S.g.add(g);S.zoom=g;render()};
  st.querySelectorAll('.dist,.call').forEach(p=>{p.onclick=()=>zoomTo(p.dataset.g);p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoomTo(p.dataset.g)}}});
  if(z)document.getElementById('mapBack').onclick=()=>{S.g.delete(z);S.zoom=null;render()};
  const pick=t=>{S.sel=t;render()};
  st.querySelectorAll('.region .spot').forEach(p=>{const ts=p.dataset.i.split(',').map(i=>TEAMS[+i]);
    const next=()=>pick(ts[(ts.indexOf(S.sel)+1)%ts.length]);p.onclick=next;p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}}});
  if($('tPrev')){$('tPrev').onclick=()=>pick(shown[(at-1+shown.length)%shown.length]);$('tNext').onclick=()=>pick(shown[(at+1)%shown.length])}
}
/* 광역시·특별시는 땅이 작아 누르기 어렵다. 바다 쪽에 이름 칩을 빼고 선으로 이어 큰 누름 영역을 준다. */
const SEA=210,CW=176,CH=88,METRO=/(광역시|특별시|특별자치시)$/;
const CALL=(()=>{const L=[],R=[];Object.entries(KR.sido).forEach(([g,d])=>{if(METRO.test(g))(d.x<KR.vb[0]/2?L:R).push({g,d})});
  const lay=(arr,x)=>{arr.sort((a,b)=>a.d.y-b.d.y);let y=-1e9;return arr.map(o=>{y=Math.max(o.d.y,y+CH+58);return {...o,cx:x,cy:y}})};
  return [...lay(L,-SEA+CW/2+10),...lay(R,KR.vb[0]+SEA-CW/2-10)]})();
let lastZoom=null;
/* 하위 지도 이름표: '수원시장안구'처럼 시 아래 구는 시 하나로 묶고, 시·군·구 꼬리는 뗀다 (한 글자만 남으면 그대로) */
const cityOf=k=>{const m=k.match(/^(.{1,4}시)(.{1,3}구)$/);return m?m[1]:k};
const shortName=k=>{const m=k.match(/^(.+?)(특별자치시|시|군|구)$/);return m&&m[1].length>1?m[1]:k};
/* 이름표 정리: 땅 크기에 맞춰 글자 크기를 정하고, 제 땅에 안 들어가거나 서로 겹치는 이름은 숨긴다 (가리키면 위쪽에 표시) */
function declutter(st,b){
  const u=Math.max(b[2],b[3])/100,box={};
  st.querySelectorAll('.sgg').forEach(p=>{const r=p.getBBox(),g=p.dataset.g,o=box[g];
    box[g]=o?{x0:Math.min(o.x0,r.x),y0:Math.min(o.y0,r.y),x1:Math.max(o.x1,r.x+r.width),y1:Math.max(o.y1,r.y+r.height)}:{x0:r.x,y0:r.y,x1:r.x+r.width,y1:r.y+r.height}});
  const items=[...st.querySelectorAll('.slabel')].map(t=>{const r=box[t.dataset.g],w=r.x1-r.x0,h=r.y1-r.y0,area=w*h;
    t.style.fontSize=Math.max(1.9*u,Math.min(3.6*u,Math.sqrt(area)*.17))+'px';return {t,w,h,area}}).sort((a,b)=>b.area-a.area);
  const placed=[];
  items.forEach(it=>{const r=it.t.getBBox(),pad=u*.5;
    const fits=r.width<=it.w*.92&&r.height<=it.h*.8;
    const hit=placed.some(q=>r.x-pad<q.x+q.width&&r.x+r.width+pad>q.x&&r.y-pad<q.y+q.height&&r.y+r.height+pad>q.y);
    if(!fits||hit)it.t.classList.add('hid');else placed.push(r)});
  const hud=document.getElementById('mapHud'),idle=hud.textContent;
  const show=p=>{hud.textContent=p.dataset.n;hud.classList.add('on');st.querySelectorAll('.sgg.hot').forEach(x=>x.classList.remove('hot'));st.querySelectorAll('.sgg').forEach(x=>{if(x.dataset.g===p.dataset.g)x.classList.add('hot')})};
  st.querySelectorAll('.sgg').forEach(p=>{p.onpointerenter=()=>show(p);p.onclick=()=>show(p);
    p.onpointerleave=e=>{if(e.pointerType==='mouse'){hud.textContent=idle;hud.classList.remove('on');p.classList.remove('hot');st.querySelectorAll('.sgg.hot').forEach(x=>x.classList.remove('hot'))}}});
}
function resetAll(){S.q='';S.t.clear();S.g.clear();$('q').value='';render()}
function setView(v){S.view=v;if(v==='map'&&S.g.size===1)S.zoom=[...S.g][0];try{history.replaceState(null,'',v==='map'?'#map':'#cards')}catch(e){}render()}
$('filters').onsubmit=e=>e.preventDefault();
$('q').oninput=e=>{S.q=e.target.value;render()};
$('reset').onclick=resetAll;
$('vCards').onclick=()=>setView('cards');$('vMap').onclick=()=>setView('map');
addEventListener('hashchange',()=>{S.view=location.hash==='#map'?'map':'cards';render()});
render();
</script>

</body>
</html>
